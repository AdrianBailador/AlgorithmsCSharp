name: Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore "AlgorithmsC#.sln"

      - name: Build
        run: dotnet build "AlgorithmsC#.sln" --no-restore --configuration Release

      - name: Test
        run: dotnet test "AlgorithmsC#.sln" --no-build --configuration Release
